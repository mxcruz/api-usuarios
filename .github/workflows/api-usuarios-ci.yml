
name: API Usuarios CI

on:
  push:
    branches:
      - '**'

jobs:
  test:
    runs-on: ubuntu-latest

    steps:
      - name: Check out the code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Brinda permiso de ejecución al script start-and-wait.sh
        run: chmod +x bin/start-and-wait.sh

      - name: Run Unit Tests And Integration Tests
        run: mvn clean verify

  build:
    if: github.ref == 'refs/heads/develop'
    runs-on: ubuntu-latest
    needs: test
    permissions:
      contents: write
      packages: write

    steps:
      - name: Check out the code
        uses: actions/checkout@v3

      - name: Set up JDK 21
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '21'

      - name: Build Package with Maven
        run: mvn clean package -DskipTests

      - name: Set up Docker image name and tag version from versionName
        id: meta
        run: |
          IMAGE=ghcr.io/${{ github.repository_owner }}/api-usuarios
          VERSION=$(mvn help:evaluate -Dexpression=project.version -q -DforceStdout)
          echo "image=$IMAGE" >> $GITHUB_OUTPUT
          echo "tag=$VERSION" >> $GITHUB_OUTPUT

      - name: Create Git tag
        run: |
          TAG=${{ steps.meta.outputs.tag }}
          echo "Tagging version: $TAG"
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag -a "$TAG" -m "Release $TAG"
          git push origin "$TAG"

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GHCR_TOKEN }}

      - name: Build and push Docker image
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}:${{ steps.meta.outputs.tag }}

      - name: Build and push Docker image latest
        uses: docker/build-push-action@v4
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.image }}:latest
