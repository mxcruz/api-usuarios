info:
  application:
    name: '@project.name@'
    description: '@project.description@'
    version: '@project.version@'
  doc:
    version: 1.0
  rest:
    connecttimeout: 3000
    readTimeout: 300

server:
  port: 80

spring:
  application:
    name: api-usuarios

  h2:
    console:
      enabled: true

  datasource:
      url: jdbc:h2:mem:usuarios
      driverClassName: org.h2.Driver
      username: sa
      password:

  jpa:
    open-in-view: true
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate.format_sql: true

  test:
    database:
      replace: none

logging:
  level:
    root: INFO

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs