info:
  application:
    name: '@project.name@'
    description: '@project.description@'
    version: '@project.version@'
  doc:
    version: 1.0
  rest:
    connecttimeout: 3000
    readTimeout: 300

server:
  port: 8888

spring:
  application:
    name: api-usuarios

  datasource:
    url: jdbc:h2:mem:usuarios;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
    driver-class-name: org.h2.Driver
    username: sa
    password:
  h2:
    console:
      enabled: true
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.H2Dialect

  test:
    database:
      replace: none

data:
  initialization:
    enabled: true
    path: data/test

jwt:
  secret:
    key: ClaveUltraSecretaParaLasPruebasQueHaremosConH2

logging:
  level:
    root: INFO
    org.springframework.web: DEBUG
    org.springframework.web.filter.CommonsRequestLoggingFilter: DEBUG

management:
  info:
    env:
      enabled: true
  endpoints:
    web:
      exposure:
        include: "*"
  endpoint:
    health:
      show-details: always
      probes:
        enabled: true

springdoc:
  swagger-ui:
    path: /swagger-ui.html
  api-docs:
    path: /api-docs